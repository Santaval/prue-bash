[pytest]
# Declara las mismas raices que el README pide exportar en PYTHONPATH, asi que
# `pytest` funciona desde la raiz del repo sin exportar nada. Cuando llegue el
# workspace de uv (ver "Pending work" en el README), este bloque se borra.
pythonpath =
    packages/model/src
    apps/api/src
    apps/trainer/src
testpaths =
    packages/model/tests
    apps/api/tests
    apps/trainer/tests
    tests/e2e
markers =
    slow: pruebas que entrenan un modelo de verdad
filterwarnings =
    ignore::DeprecationWarning:tensorflow.*
