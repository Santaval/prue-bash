# Despliegue completo (UI + API), pensado para Coolify (build pack
# "Docker Compose"). Ver docs/deploy-coolify.md.
#
# Solo "ui" se publica: Coolify le asigna el dominio mediante SERVICE_FQDN_UI_80.
# La API queda en la red interna; la UI llega a ella por /api, que nginx
# reenvía al servicio "api". Las predicciones se guardan en Supabase.
services:
  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    environment:
      - SERVICE_FQDN_UI_80
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      args:
        TRAIN_ARGS: ${TRAIN_ARGS:---all}
    environment:
      API_MODELS: ${API_MODELS:-diabetes,academic_risk,loan_amount}
      API_SKIP_MODEL_LOADING: ${API_SKIP_MODEL_LOADING:-false}
      PERSISTENCE_BACKEND: supabase
      SUPABASE_URL: ${SUPABASE_URL:?}
      SUPABASE_KEY: ${SUPABASE_KEY:?}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
    expose:
      - "8000"
    restart: unless-stopped
