name: Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # data/processed is gitignored; the model tests and trainer need it.
      - name: Generate processed datasets
        run: |
          python scripts/clean_diabetes.py
          python scripts/clean_loan.py
          python scripts/clean_academic.py

      # pytest.ini already sets pythonpath and testpaths. Includes slow tests
      # (they train real models).
      - name: Run tests
        run: pytest -v
